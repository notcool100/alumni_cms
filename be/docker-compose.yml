version: '3.8'

services:
  # .NET Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alumni_api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=alumni.db
      - JWT__Issuer=YourIssuer
      - JWT__Audience=YourAudience
      - JWT__Secret=your-super-secret-jwt-key-change-in-production
      - JWT__ExpiryInHours=24
    ports:
      - "5000:80"
      - "5001:443"
    networks:
      - alumni_network
    volumes:
      - ./WebAPI:/app
      - /app/bin
      - /app/obj

networks:
  alumni_network:
    driver: bridge
