version: '3.8'

services:
  # .NET Backend
  backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: alumni_backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=alumni.db
      - JWT__Secret=your-super-secret-jwt-key-change-in-production
      - PORT=3000
    ports:
      - "3000:80"
    networks:
      - alumni_network
    volumes:
      - ./be:/app
      - /app/bin
      - /app/obj

  # Svelte Frontend
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: alumni_frontend
    environment:
      PUBLIC_API_URL: http://localhost:3000
      PUBLIC_APP_NAME: Alumni Network
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - alumni_network
    volumes:
      - ./fe:/app
      - /app/node_modules

networks:
  alumni_network:
    driver: bridge
